name: Focused Linux source failure diagnostic
on:
  push:
    branches:
      - ci/fortipi-linux-source-failure-probe-*
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-source-failure-probe-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: "true"
  GOTOOLCHAIN: local
  FORTIPI_EVIDENCE_FIXTURE: tests/clients/fixtures/local.json
  WRANGLER_SEND_METRICS: "false"
  npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
  npm_config_build_from_source: "true"
jobs:
  linux-source-failure-probe:
    name: Focused source failures (Linux)
    if: github.repository == 'scottdraper8/fortipi' && !github.event.repository.fork &&
      startsWith(github.ref, 'refs/heads/ci/fortipi-linux-source-failure-probe-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443 objects.githubusercontent.com:443
            raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
            codeload.github.com:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443
            registry.npmjs.org:443 nodejs.org:443 www.python.org:443 downloads.python.org:443
            pypi.org:443 files.pythonhosted.org:443 go.dev:443 dl.google.com:443
            proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 api.osv.dev:443
            download.docker.com:443 auth.docker.io:443 registry-1.docker.io:443
            production.cloudflare.docker.com:443 ghcr.io:443
            pkg-containers.githubusercontent.com:443 snapshot.debian.org:443 cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443 archive.ubuntu.com:80 security.ubuntu.com:80
            azure.archive.ubuntu.com:80 api.unstale.sh:443 unstale.sh:443 *.stepsecurity.io:443
      - name: Require Linux hardener service active
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          check-latest: false
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.18.0
          run_install: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python
        with:
          python-version: 3.15.2
          check-latest: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          check-latest: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/unstale install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc -p packages/fortipi-contract/tsconfig.json
      - run: node scripts/verify-foundation.ts --egress
      - run: node tools/unstale/review-supply-chain.ts --locks --check
      - run: pnpm run check:pins
      - run: pnpm run check:licenses -- --foundation
      - name: Save qualified image reference
        env:
          IMAGE_REFERENCE: ${{ vars.FORTIPI_IMAGE_REFERENCE }}
        run: node scripts/prepare-release.ts descriptor --kind image --out
          "$RUNNER_TEMP/image-reference.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ fromJSON(vars.FORTIPI_IMAGE_REFERENCE).runId }}
          artifact-ids: ${{ fromJSON(vars.FORTIPI_IMAGE_REFERENCE).artifactId }}
          path: ${{ runner.temp }}/qualified-image
      - name: Authenticate image and recreate its exact context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.ts image --descriptor "$RUNNER_TEMP/image-reference.json"
          --downloaded "$RUNNER_TEMP/qualified-image"
      - run: pnpm run build
      - run: node scripts/generate-notices.ts
      - run: pnpm run check:licenses
      - name: Capture only closed diagnostics from the seven selected source files
        run: node scripts/linux-source-failure-probe.ts
      - name: Require Linux hardener service still active
        if: always() && runner.os == 'Linux'
        shell: bash
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
