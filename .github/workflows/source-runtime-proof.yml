name: Source runtime Windows collection control
on:
  push:
    branches: ["ci/fortipi-source-runtime-proof-*"]
permissions:
  contents: read
concurrency:
  group: source-runtime-proof-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: "true"
  GOTOOLCHAIN: local
  WRANGLER_SEND_METRICS: "false"
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
  npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
  npm_config_build_from_source: "true"
jobs:
  source-runtime-control:
    if: >-
      github.repository == 'scottdraper8/fortipi' && !github.event.repository.fork &&
      startsWith(github.ref, 'refs/heads/ci/fortipi-source-runtime-proof-')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 github.com:443 objects.githubusercontent.com:443
            raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
            codeload.github.com:443 *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443 registry.npmjs.org:443 nodejs.org:443
            api.osv.dev:443 go.dev:443 dl.google.com:443 proxy.golang.org:443
            sum.golang.org:443 storage.googleapis.com:443 *.stepsecurity.io:443
            www.python.org:443 downloads.python.org:443 pypi.org:443 files.pythonhosted.org:443
      - name: Require Linux hardener service active
        if: runner.os == 'Linux'
        shell: bash
        run: /usr/bin/systemctl is-active --quiet agent.service
        timeout-minutes: 1
      - name: Retain canonical repository line endings for source validation
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Observe native sampling prerequisites
        if: startsWith(github.ref, 'refs/heads/ci/fortipi-source-runtime-proof-native-prereq-')
        run: node scripts/native-control-availability.ts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.18.0"
          run_install: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          check-latest: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - run: node scripts/install-dependencies.ts
      - run: pnpm --dir tools/unstale install --frozen-lockfile
      - run: node scripts/verify-foundation.ts --native
      - run: node tools/unstale/review-supply-chain.ts --locks --check
      - run: node scripts/check-licenses.ts --foundation
      - run: pnpm run build:executor
      - run: pnpm run typecheck:executor
      - name: Probe Windows startup and state protection
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: node packages/fortipi-executor/test/fixtures/daemon.ts windows-probe
      - name: Probe native state denial across identities
        timeout-minutes: 2
        run: node packages/fortipi-executor/test/fixtures/cross-identity.ts
      - name: Observe owned runtime roles and CPU ticks
        if: startsWith(github.ref, 'refs/heads/ci/fortipi-source-runtime-proof-native-role-')
        run: node --test --test-reporter=tap scripts/native-owned-role-control.ts
        timeout-minutes: 2
      - name: Check actual owned collection before and after authority loss
        run: >-
          node --test --test-reporter=tap
          '--test-name-pattern=^(actual post-exit collection stays pending_sync only in its owning runtime|owned post-exit collection loses certainty at real lease expiry and revocation)$'
          packages/fortipi-executor/test/executor-job.test.ts
      - name: Require runner egress enforcement
        if: always()
        run: node scripts/verify-foundation.ts --egress
      - name: Require Linux hardener service still active
        if: always() && runner.os == 'Linux'
        shell: bash
        run: /usr/bin/systemctl is-active --quiet agent.service
        timeout-minutes: 1
