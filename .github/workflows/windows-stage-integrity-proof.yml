name: Windows local-stage integrity diagnostic
on:
  push:
    branches:
      - ci/fortipi-windows-stage-integrity-proof-*
permissions:
  contents: read
concurrency:
  group: windows-stage-integrity-proof-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: "true"
  GOTOOLCHAIN: local
  WRANGLER_SEND_METRICS: "false"
  npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
  npm_config_build_from_source: "true"
jobs:
  windows-stage-integrity-control:
    if: github.repository == 'scottdraper8/fortipi' && !github.event.repository.fork &&
      startsWith(github.ref, 'refs/heads/ci/fortipi-windows-stage-integrity-proof-')
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443 objects.githubusercontent.com:443
            raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
            codeload.github.com:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443
            registry.npmjs.org:443 nodejs.org:443 www.python.org:443 downloads.python.org:443
            pypi.org:443 files.pythonhosted.org:443 go.dev:443 dl.google.com:443
            proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 api.osv.dev:443
            download.docker.com:443 auth.docker.io:443 registry-1.docker.io:443
            production.cloudflare.docker.com:443 ghcr.io:443
            pkg-containers.githubusercontent.com:443 snapshot.debian.org:443 cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443 archive.ubuntu.com:80 security.ubuntu.com:80
            azure.archive.ubuntu.com:80 api.unstale.sh:443 unstale.sh:443 *.stepsecurity.io:443
      - name: Require Linux hardener service active
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          check-latest: false
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.18.0
          run_install: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.15.2
          check-latest: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          check-latest: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/unstale install --frozen-lockfile
      - run: node scripts/verify-foundation.ts --native
        timeout-minutes: 3
      - run: pnpm run build:executor
      - run: pnpm run typecheck:executor
      - name: Observe the exact local-stage integrity test under strict Windows protection
        run: >-
          node --test --test-reporter=tap
          --test-name-pattern='^local-stage status waits for actual empty or multichunk durable consumer proof and current authority$'
          packages/fortipi-executor/test/transport.test.ts
      - name: Require runner egress enforcement
        if: always()
        run: node scripts/verify-foundation.ts --egress
    name: Windows local-stage integrity
