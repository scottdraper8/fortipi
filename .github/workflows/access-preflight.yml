name: Access preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
      - name: Require Linux hardener service active
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Verify Cloudflare access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-access.ts cloudflare

  npm:
    runs-on: ubuntu-24.04
    environment: npm-release
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org:443
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
      - name: Require Linux hardener service active
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Verify npm access
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: node scripts/check-access.ts npm
