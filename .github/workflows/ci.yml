name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  GOTOOLCHAIN: local
  FORTIPI_EVIDENCE_FIXTURE: tests/clients/fixtures/local.json
  WRANGLER_SEND_METRICS: "false"
  npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
  npm_config_build_from_source: "true"
jobs:
  policy-and-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            www.python.org:443
            downloads.python.org:443
            pypi.org:443
            files.pythonhosted.org:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            api.osv.dev:443
            download.docker.com:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            snapshot.debian.org:443
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            azure.archive.ubuntu.com:80
            api.unstale.sh:443
            unstale.sh:443
            *.stepsecurity.io:443
      - name: Require Linux hardener service active
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          check-latest: false
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.18.0"
          run_install: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          check-latest: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/unstale install --frozen-lockfile
      - run: node scripts/verify-foundation.ts --egress
      - run: node tools/unstale/review-supply-chain.ts --locks --check
      - run: pnpm run check:pins
      - run: node --test tools/unstale/foundation.test.ts
      - run: node tools/unstale/provision-docker.ts
      - run: python -m pip install pre-commit==4.7.0
      - run: pnpm run check:licenses -- --foundation
      - run: pnpm run unstale:check
      - run: pnpm run build
      - run: pnpm run verify:foundation
        timeout-minutes: 3
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run schema:check
      - run: pnpm run test
      - run: pnpm run candidate:local
      - run: pnpm run check:licenses
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - run: pre-commit run --all-files
  native-executor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            www.python.org:443
            downloads.python.org:443
            pypi.org:443
            files.pythonhosted.org:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            api.osv.dev:443
            download.docker.com:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            snapshot.debian.org:443
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            azure.archive.ubuntu.com:80
            api.unstale.sh:443
            unstale.sh:443
            *.stepsecurity.io:443
      - name: Require Linux hardener service active
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          check-latest: false
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12.18.0"
          run_install: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          check-latest: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/unstale install --frozen-lockfile
      - run: node scripts/verify-foundation.ts --native
        timeout-minutes: 3
      - run: pnpm run build:executor
      - run: pnpm run typecheck:executor
      - name: Probe Windows startup and state protection
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: node packages/fortipi-executor/test/fixtures/daemon.ts windows-probe
      - name: Probe native state denial across identities
        timeout-minutes: 2
        run: node packages/fortipi-executor/test/fixtures/cross-identity.ts
      - run: pnpm run test:executor
      - name: Require runner egress enforcement
        if: always()
        run: node scripts/verify-foundation.ts --egress
