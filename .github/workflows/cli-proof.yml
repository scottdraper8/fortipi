name: Installed CLI offline proof
on:
  push:
    branches: ["ci/fortipi-cli-proof-*"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cli-proof-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  SOURCE_SHA: ${{ github.sha }}
  IMAGE_REFERENCE: ${{ vars.FORTIPI_IMAGE_REFERENCE }}
  WRANGLER_SEND_METRICS: "false"
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
  npm_config_build_from_source: "true"
  npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
  FORTIPI_CLI_PROOF_PNPM: /tmp/fortipi-cli-proof-pnpm
jobs:
  installed-offline:
    if: startsWith(github.ref, 'refs/heads/ci/fortipi-cli-proof-') && !github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            www.python.org:443
            downloads.python.org:443
            pypi.org:443
            files.pythonhosted.org:443
            api.osv.dev:443
            *.actions.githubusercontent.com:443
            api.stepsecurity.io:443
            agent.api.stepsecurity.io:443
      - name: Require actual Linux hardener service
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          check-latest: false
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        id: pnpm
        with:
          version: "12.18.0"
          dest: ${{ env.FORTIPI_CLI_PROOF_PNPM }}
          run_install: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          check-latest: false
      - name: Require frozen owner ports
        run: node scripts/cli-proof.ts inputs
      - name: Populate the pinned producer store before the normal frozen install
        run: pnpm fetch --frozen-lockfile --ignore-scripts
      - run: node scripts/install-dependencies.ts
      - run: pnpm --dir tools/unstale install --frozen-lockfile
      - run: node scripts/verify-foundation.ts --egress
      - name: Probe the installed native build tools and PTY behavior
        run: node scripts/verify-foundation.ts --native
      - run: node tools/unstale/review-supply-chain.ts --locks --check
      - run: node scripts/check-licenses.ts --foundation
      - run: node scripts/build-workspaces.ts build:evidence
      - name: Save the qualified image descriptor
        run: node scripts/prepare-release.ts descriptor --out "$RUNNER_TEMP/image-reference.json" --kind image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ fromJSON(vars.FORTIPI_IMAGE_REFERENCE).runId }}
          artifact-ids: ${{ fromJSON(vars.FORTIPI_IMAGE_REFERENCE).artifactId }}
          path: ${{ runner.temp }}/qualified-image
      - name: Verify the qualified image inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cli-proof.ts image
      - run: pnpm run build
      - run: node scripts/generate-notices.ts
      - run: pnpm run typecheck
      - run: pnpm run schema:check
      - run: pnpm run check:licenses
      - name: Stage and install the five scoped source component bundles
        run: node scripts/cli-proof.ts install
      - name: Run the installed CLI with an empty OS home and no external network
        env:
          FORTIPI_CLI_PROOF_PNPM_BIN: ${{ steps.pnpm.outputs.bin_dest }}
        run: node scripts/cli-proof.ts offline
      - name: Require hardener still active
        if: always()
        timeout-minutes: 1
        run: /usr/bin/systemctl is-active --quiet agent.service
      - name: Retain only the redacted proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-proof-${{ env.SOURCE_SHA }}
          path: dist/cli-proof/evidence.json
          if-no-files-found: error
          retention-days: 7
