version: 2
updates:
  - package-ecosystem: pip
    directory: /tools/unstale
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase
  - package-ecosystem: npm
    directory: /tools/unstale
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
